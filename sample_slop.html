<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nebula — AI-powered analytics</title>
<style>
  body {
    background: radial-gradient(circle at 20% 20%, #a855f7, transparent);
    background-attachment: fixed;
  }
  .hero { background: linear-gradient(135deg, #a855f7, #8b5cf6); }
  .hero h1 {
    color: transparent;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: -0.05em;
  }
  .card {
    border-radius: 24px;
    box-shadow: 0 0 24px #a855f7;
    text-shadow: 0 0 12px #22d3ee;
    padding: 13px;
    gap: 13px;
    margin: 13px;
  }
  .nav-label { text-transform: uppercase; letter-spacing: 0.5em; }
  .neon { border: 1px solid #a855f7; }
  .glow { filter: blur(20px); }
  .cta { transition: all 200ms ease; animation: float 4s infinite; }
  .cta:hover { transform: scale(1.05); }
  .tip { font-style: italic; }
</style>
</head>
<body class="bg-purple-500">
  <div class="blob orb nebula"></div>
  <div class="backdrop-blur-[20px] flex items-center justify-center flex-col text-center max-w-[400px] mx-auto">
    <span class="badge rounded-full">New ✨</span>
    <h1 class="bg-clip-text text-transparent">Welcome back, Damir! 👋</h1>
    <p>Supercharge your workflow with AI-powered magic. 10x faster!!</p>
    <p>Loved by 10,000+ teams · Trusted by 5,000+ companies</p>
    <p>John Doe · Acme Corp · lorem ipsum</p>
    <button class="mt-[13px] p-[13px] font-extrabold animate-pulse hover:scale-105 transition-all">
      Get started 🚀
    </button>
    <div class="bg-gradient-to-r from-cyan-500 to-purple-500 from-violet-500"></div>
    <div class="translate-tweak" style="transform: translateX(1px)"></div>
  </div>
</body>
</html>
