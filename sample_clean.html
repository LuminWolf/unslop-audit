<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger — October 2026</title>
<style>
  :root {
    --bg: #151516;
    --surface: #1e1e1f;
    --ink: #ececeb;
    --muted: #9a9a99;
    --line: rgba(236, 236, 235, .08);
    --accent: #4b7f6a;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Söhne", system-ui, sans-serif;
  }
  .shell {
    display: grid;
    grid-template-columns: 264px minmax(0, 1fr);
    min-height: 100vh;
  }
  .side {
    padding: 24px 16px;
    border-right: 1px solid var(--line);
  }
  .side .row {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .side .group-label {
    padding: 24px 0 8px;
    color: var(--muted);
    font-size: 12px;
  }
  main { padding: 32px; max-width: 1520px; }
  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  h1 { font-size: 28px; font-weight: 500; margin: 0 0 24px; }
  .figures { font-variant-numeric: tabular-nums; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 32px; font-weight: 500; }
  .btn {
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 500;
    transition: color 150ms ease, background-color 150ms ease;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chart { display: grid; gap: 8px; }
</style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="group-label">Workspace</div>
      <div class="row"><svg width="18" height="18" stroke-width="1.5"></svg>Overview</div>
      <div class="row"><svg width="18" height="18" stroke-width="1.5"></svg>Invoices</div>
      <div class="row"><svg width="18" height="18" stroke-width="1.5"></svg>Settings</div>
    </aside>
    <main>
      <div class="head">
        <h1>October 2026</h1>
        <button class="btn">Export</button>
      </div>
      <div class="card figures">
        <div class="label">Paid this month</div>
        <div class="value">$48,210</div>
        <div class="label">+12% vs last month</div>
      </div>
      <div class="card chart" aria-label="Revenue by week">
        <div class="label">Revenue by week</div>
      </div>
    </main>
  </div>
</body>
</html>
